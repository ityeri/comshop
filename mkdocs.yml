site_name: comshop
site_description: A Kotlin DSL for defining Minecraft Paper commands, built on Brigadier
site_url: https://ityeri.github.io/comshop/
repo_url: https://github.com/ityeri/comshop
repo_name: ityeri/comshop
edit_uri: edit/develop/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  logo: assets/logo.svg
  favicon: assets/logo.svg

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Version Compatibility: getting-started/compatibility.md
  - Guide:
      - Command Structure: guide/command-structure.md
      - Defining Arguments: guide/arguments.md
      - Reading Arguments: guide/reading-arguments.md
      - Custom Arguments: guide/custom-arguments.md
      - Suggestions: guide/suggestions.md
      - Results & Errors: guide/results-and-errors.md
  - Reference:
      - Argument Types: reference/argument-types.md
  - Examples: examples.md
  - Internals:
      - Architecture: internals/architecture.md
      - Adding a Version: internals/adding-a-version.md
  - FAQ: faq.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ityeri/comshop
